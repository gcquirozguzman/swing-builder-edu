# --- Proyecto ---
pluginGroup=com.vanlutec
# La version es la fuente de verdad: el tag de git (vX.Y.Z) tiene que coincidir con
# esto o la publicacion se para. Subela en cada entrega a los alumnos.
pluginVersion=0.1.0

# Repositorio en GitHub. De aqui salen las URL de descarga del updatePlugins.xml.
pluginRepositoryUrl=https://github.com/gcquirozguzman/swing-builder-edu

# Plataforma sobre la que se compila (IntelliJ IDEA Community).
# El plugin queda instalable desde 2024.3 (build 243) en adelante.
platformType=IC
platformVersion=2024.3.6
pluginSinceBuild=243

# --- Gradle ---
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.configuration-cache=false

# "gradlew" necesita un JAVA_HOME valido (JDK 21 o superior). Si no lo tienes,
# puedes apuntar aqui al JDK/JBR concreto que quieras usar para compilar
# (el lanzador seguira necesitando un JAVA_HOME valido para arrancar Gradle).
# Ejemplo (JBR que trae IntelliJ IDEA):
# org.gradle.java.home=C:/Program Files/JetBrains/IntelliJ IDEA 2026.1.3/jbr
